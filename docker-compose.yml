services:
  deepseek-harness:
    image: ghcr.io/misaka-link/deepseek-harness-docker:latest
    container_name: deepseek-harness
    restart: unless-stopped
    ports:
      # Выставляется только один объединённый порт (внутри него DSH Web, панель управления
      # и VNC рабочий стол, общая единая аутентификация)
      # M13: следует PROXY_PORT из .env (по умолчанию 3080), чтобы при смене пароля/порта
      # маппинг хоста не разъезжался молча
      - "${PROXY_PORT:-3080}:${PROXY_PORT:-3080}"
    environment:
      # Код доступа (только с ним открываются DSH Web, панель управления и VNC рабочий стол)
      # Пусто: при первом заходе автоматически открывается страница «Настройка кода доступа»,
      #         только после неё сервис работает (режима «прохода без пароля» больше нет)
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      # Единый внешний порт доступа (M13: следует .env; явный env приоритетнее сохранённого на томе)
      - PROXY_PORT=${PROXY_PORT:-3080}
      # Корневой каталог выполнения (M11: при non-root развёртывании ставить /home/dsh)
      - DSH_HOME=${DSH_HOME:-/root}
      # Порог свободного места на диске перед сменой версии (МБ, по умолчанию 1536);
      # для слабых конфигураций и учений по отказам
      - DSH_VERSIONS_MIN_FREE_MB=${DSH_VERSIONS_MIN_FREE_MB:-1536}

      # Исходящий сетевой прокси (необязательно: DSH 0.1.5-rc.1 нативно следует переменным окружения прокси)
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}

      # --- Ниже параметры уже имеют встроенные в контейнер/шлюз значения по умолчанию,
      #     для простоты закомментированы, включайте по мере необходимости: ---
      # - SESSION_SECRET=${SESSION_SECRET:-}  # Свой ключ подписи Session (по умолчанию авто-генерация
                                              # и сохранение на том данных)
      # - ADMIN_PATH=/admin                  # Свой путь панели управления (по умолчанию /admin)
      # - VNC_PATH=/vnc                      # Свой путь VNC рабочего стола (по умолчанию /vnc)
      # - DSH_WORKSPACE=/workspace           # Каталог рабочей области по умолчанию
      # - DSH_DESKTOP_ENABLED=1              # Включать ли встроенный графический Chromium-рабочий стол
                                              # (1: включено, 0: выключено)
      # - DSH_IDLE_TIMEOUT_MINUTES=30        # Сон рабочего стола браузера по простою
                                              # (минут; 0 = без сна, работает всегда)
      # - DSH_DESKTOP_WIDTH=1920             # Ширина разрешения виртуального рабочего стола
      # - DSH_DESKTOP_HEIGHT=1080            # Высота разрешения виртуального рабочего стола
      # - DSH_SCREENSHOT_QUALITY=high        # Качество скриншотов ИИ по умолчанию (high/medium/low)
      # - DSH_SCREENSHOT_DIR=                # Подкаталог сохранения скриншотов ИИ по умолчанию
                                              # (относительно рабочей области)
      # - DSH_MAX_ARCHIVE_MEMBERS=1000000    # Верхний предел числа членов архива до восстановления/импорта
                                              # (по умолчанию 1 млн; увеличивайте только если снимок реально
                                              # больше этого масштаба)

    # ── M11 укрепление контейнера ─────────────────────────────────────────────
    # 1) запрет повышения привилегий (setuid/setgid-бинарники не получат новых прав)
    security_opt:
      - no-new-privileges:true
    # 2) сброшены все Linux capabilities, возвращён только минимальный набор для работы root
    #    (скрипт входа правит владельца/права тома, порождает и управляет дочерними процессами)
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    # 3) [необязательно] работать как non-root (понадёжнее): раскомментируйте две строки ниже
    #    и поменяйте volumes на пути вида /home/dsh/.dsh (каталог хоста должен быть
    #    chown 1001:1001); тогда блок cap_add выше можно удалить.
    # user: "1001:1001"
    # в environment добавить: - DSH_HOME=/home/dsh
    volumes:
      # 1. каталог системы и конфигурации DSH (плагины, пресеты, файлы конфигурации и история сессий)
      - ./data/dsh:/root/.dsh
      # 2. отдельный каталог рабочего пространства проекта (код/документы, созданные ИИ, изолирован
      #    от системы DSH)
      - ./workspace:/workspace
      # 3. каталог снимков и архивов резервных копий конфигурации DSH
      #    (внутри versions/ — архив ядра; Issue #7: откат без повторной загрузки)
      - ./data/snapshots:/root/.dsh-snapshots
      # 4. кэш пользовательских данных Chromium (необязательно: сохраняет входа/cookies браузера)
      - ./data/browser:/root/.config/chromium
