name: Build and Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Project version tag (e.g. 0.2.3)'
        required: false
        default: '0.2.3'
  push:
    branches:
      - main
    tags:
      - 'v*'
      # Фильтр тегов у GitHub — это glob, а не регулярное выражение: `+` здесь литеральный символ,
      # старая запись '[0-9]+.[0-9]+.[0-9]+*' никогда не совпадала
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read
  packages: write

jobs:
  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version_detector.outputs.should_build }}
      project_version: ${{ steps.version_detector.outputs.project_version }}
    steps:
      - name: Checkout repository
        # Безопасность цепочки поставок: фиксация на commit SHA (тег можно переносить)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Detect Version Change
        id: version_detector
        run: |
          SHOULD_BUILD="true"

          # 1. ручной триггер workflow_dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROJ_VER="${{ github.event.inputs.version }}"
            [ -z "$PROJ_VER" ] && PROJ_VER="0.2.3"
            echo "✔ Ручной запуск (workflow_dispatch), заданная версия: ${PROJ_VER}"

          # 2. триггер по Git-тегу (например v0.0.9)
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            PROJ_VER="${BASH_REMATCH[1]}"
            echo "✔ Запуск релиза по Git-тегу, версия: ${PROJ_VER}"

          # 3. push в main: строгое сравнение изменения номера версии
          else
            PROJ_VER=$(grep -E '^PROJ_VER=' build.sh | cut -d'"' -f2 || true)
            [ -z "$PROJ_VER" ] && PROJ_VER="0.2.3"

            PREV_VER=$(git show HEAD~1:build.sh 2>/dev/null | grep -E '^PROJ_VER=' | cut -d'"' -f2 || true)
            echo "Текущая версия: [${PROJ_VER}], версия в предыдущем коммите: [${PREV_VER}]"

            if [ -n "$PREV_VER" ] && [ "$PROJ_VER" = "$PREV_VER" ]; then
              echo "⚠ Номер версии проекта не изменился (${PROJ_VER} == ${PREV_VER}), автопостроение и публикация образа пропускаются!"
              SHOULD_BUILD="false"
            else
              echo "✔ Обнаружено изменение номера версии проекта (${PREV_VER:-init} -> ${PROJ_VER}), запускаем построение образа!"
            fi
          fi

          PROJ_VER="${PROJ_VER#v}"
          echo "project_version=${PROJ_VER}" >> $GITHUB_OUTPUT
          echo "should_build=${SHOULD_BUILD}" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build and Push (${{ matrix.variant }})
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            preinstall_plugins: "0"
            suffix: ""
            latest_tag: "latest"
          - variant: market
            preinstall_plugins: "1"
            suffix: "-market"
            latest_tag: "latest-market"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker Tags
        id: docker_meta
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/deepseek-harness-docker"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          SUFFIX="${{ matrix.suffix }}"
          LATEST_TAG="${{ matrix.latest_tag }}"
          PROJ_VER="${{ needs.check-version.outputs.project_version }}"

          # M10: встроенная версия DSH имеет единственный источник — version.json#supply
          # (никакого динамического опроса registry при каждом построении, иначе тот же код
          # в разное время соберётся в различающиеся по содержимому образы)
          DSH_VERSION=$(node -e "process.stdout.write(require('./version.json').supply.dshVersion||'')")
          if [ -z "$DSH_VERSION" ]; then
            echo "Ошибка: version.json#supply.dshVersion не задан" >&2
            exit 1
          fi
          echo "dsh_version=${DSH_VERSION}" >> $GITHUB_OUTPUT
          echo "Detected built-in DSH Version: ${DSH_VERSION}"
          echo "Current Project Version: ${PROJ_VER}"

          TAGS=""
          # основной тег по умолчанию (:latest / :latest-market)
          TAGS="${TAGS}${IMAGE_NAME}:${LATEST_TAG},"

          # доп. тег 1: номер версии встроенного официального DeepSeek Harness
          TAGS="${TAGS}${IMAGE_NAME}:${DSH_VERSION}${SUFFIX},"
          TAGS="${TAGS}${IMAGE_NAME}:dsh-${DSH_VERSION}${SUFFIX},"

          # доп. тег 2: номер инженерной версии этого проекта
          TAGS="${TAGS}${IMAGE_NAME}:${PROJ_VER}${SUFFIX},"
          TAGS="${TAGS}${IMAGE_NAME}:v${PROJ_VER}${SUFFIX}"

          # совместимый традиционный короткий тег (:market)
          if [ "${{ matrix.variant }}" = "market" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:market"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          # M10: генерация SLSA provenance и SBOM (прослеживаемость цепочки поставок)
          provenance: mode=max
          sbom: true
          # Уникально для каждой сборки — принудительная инвалидация кэша слоя предустановки
          # в Dockerfile, чтобы dshmarket@latest из plugins.market.list действительно подтянул
          # версию текущей сборки
          build-args: |
            NODE_IMAGE=node:24-trixie
            NOVNC_ASSET_REVISION=1.6.0
            PREINSTALL_PLUGINS=${{ matrix.preinstall_plugins }}
            DSH_VERSION=${{ steps.docker_meta.outputs.dsh_version }}
            MARKET_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
            USE_CHINA_MIRROR=0
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  smoke-test:
    name: Smoke Test (${{ matrix.variant }})
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            tag: latest
          - variant: market
            tag: latest-market
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # M10: после публикации образа — минимальный дымовой тест: поднять контейнер,
      # дождаться health-проверки, проверить /healthz и загрузку плагинов
      - name: Smoke test container
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deepseek-harness-docker:${{ matrix.tag }}"
          docker pull "$IMAGE"
          docker run -d --name dsh-smoke -p 18080:3080 \
            -e AUTH_TOKEN=smoke-test-token-0123456789 \
            -e PROXY_PORT=3080 "$IMAGE"
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/healthz >/tmp/healthz.json 2>/dev/null; then ok=1; break; fi
            sleep 5
          done
          echo "--- /healthz ---"; cat /tmp/healthz.json || true; echo
          docker logs dsh-smoke | tail -40 || true
          docker rm -f dsh-smoke >/dev/null 2>&1 || true
          [ "$ok" = "1" ] || { echo "Дымовой тест провален: /healthz не готов"; exit 1; }
          grep -q '"ok":true' /tmp/healthz.json
          echo "Дымовой тест пройден"
