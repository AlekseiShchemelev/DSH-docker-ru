name: "Build Issue #9 Test Image"

# Назначение (Issue #9):
#   отдельно собирает тестовый образ **с независимым тегом** для случая, когда «относительные
#   симлинки, порождённые зависимостью pnpm `link:` в старом снимке, убивались валидацией
#   архива» — чтобы пользователь из фидбэка мог сделать `docker pull` и проверить фикс напрямую,
#   **не затрагивая** :latest / :latest-market и официальный процесс релиза.
#
# Триггеры:
#   1) push в ветки fix/issue-9-* (эта ветка) — автоматическая сборка;
#   2) ручной workflow_dispatch (можно задать имя тега).
#
# Теги на выходе (ghcr.io/misaka-link/deepseek-harness-docker):
#   :issue9-fix          (чистая версия)
#   :issue9-fix-market   (версия с предустановленным маркетплейсом)
#
# Эквивалентная локальная сборка (без CI):
#   EXTRA_TAGS="issue9-fix" ./build.sh
#   EXTRA_TAGS="issue9-fix-market" ./build.sh --market

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'База имени дополнительного тега образа (по умолчанию issue9-fix; производные :<tag> и :<tag>-market)'
        required: false
        default: 'issue9-fix'
  push:
    branches:
      - 'fix/issue-9-*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            preinstall_plugins: "0"
            suffix: ""
          - variant: market
            preinstall_plugins: "1"
            suffix: "-market"

    steps:
      - name: Checkout repository
        # Безопасность цепочки поставок: фиксация на commit SHA (тег можно переносить)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag & DSH version
        id: meta
        run: |
          set -euo pipefail
          BASE_TAG="${{ github.event.inputs.tag }}"
          [ -z "${BASE_TAG}" ] && BASE_TAG="issue9-fix"
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deepseek-harness-docker"
          DSH_VERSION=$(node -e "process.stdout.write(require('./version.json').supply.dshVersion||'')")
          if [ -z "${DSH_VERSION}" ]; then
            echo "Ошибка: version.json#supply.dshVersion не задан" >&2
            exit 1
          fi
          echo "dsh_version=${DSH_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${IMAGE_NAME}:${BASE_TAG}${{ matrix.suffix }}" >> $GITHUB_OUTPUT
          echo ">>> Тег текущей сборки: ${IMAGE_NAME}:${BASE_TAG}${{ matrix.suffix }} (встроенный DSH ${DSH_VERSION})"

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          # Генерация SLSA provenance и SBOM (прослеживаемость цепочки поставок)
          provenance: mode=max
          sbom: true
          # Уникально для каждой сборки — принудительная инвалидация кэша слоя предустановки
          # (как в официальном процессе релиза)
          build-args: |
            NODE_IMAGE=node:24-trixie
            NOVNC_ASSET_REVISION=1.6.0
            PREINSTALL_PLUGINS=${{ matrix.preinstall_plugins }}
            DSH_VERSION=${{ steps.meta.outputs.dsh_version }}
            MARKET_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
            USE_CHINA_MIRROR=0
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
